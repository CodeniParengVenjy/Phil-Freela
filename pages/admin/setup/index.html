<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhilFreela Admin – First-Time Setup</title>
  <link rel="icon" type="image/svg+xml" href="../../../images/logo-philfreela.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../login/login.css" />
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <main class="auth-wrapper position-relative w-100 px-3 max-w-500">
    <div class="auth-bg-glow glow-orange"></div>
    <div class="auth-bg-glow glow-cyan"></div>

    <section class="auth-card glass-card p-4 p-sm-5 rounded-5 border border-secondary border-opacity-25 shadow-2xl position-relative z-2">
      <div class="text-center mb-4">
        <img src="../../../images/logo-philfreela.svg" alt="PhilFreela" style="height: 46px;" class="logo-glow mb-3" />
        <p class="text-warning fw-extrabold tracking-widest fs-8 text-uppercase mb-1">ADMIN BOOTSTRAP</p>
        <h1 class="fw-black text-white h3 mb-1">Create the First Admin</h1>
        <p class="text-secondary fs-7 mb-0">This form only works once, while no admin account exists yet.</p>
      </div>

      <form id="setupForm" class="d-flex flex-column gap-3" novalidate>
        <div class="field">
          <label for="fullName" class="form-label text-white-50 fw-semibold fs-7 mb-1">Full Name</label>
          <input id="fullName" name="fullName" type="text" class="form-control bg-secondary bg-opacity-25 border-secondary text-white py-2" required />
        </div>
        <div class="field">
          <label for="username" class="form-label text-white-50 fw-semibold fs-7 mb-1">Username</label>
          <input id="username" name="username" type="text" class="form-control bg-secondary bg-opacity-25 border-secondary text-white py-2" required />
        </div>
        <div class="field">
          <label for="email" class="form-label text-white-50 fw-semibold fs-7 mb-1">Email Address</label>
          <input id="email" name="email" type="email" class="form-control bg-secondary bg-opacity-25 border-secondary text-white py-2" required />
        </div>
        <div class="field">
          <label for="password" class="form-label text-white-50 fw-semibold fs-7 mb-1">Password</label>
          <input id="password" name="password" type="password" class="form-control bg-secondary bg-opacity-25 border-secondary text-white py-2" placeholder="Min 8 chars, upper/lower/number" required />
        </div>
        <button type="submit" id="submitBtn" class="btn btn-gradient-orange btn-lg w-100 rounded-3 fw-bold text-white shadow-glow py-2">
          Create Admin Account
        </button>
      </form>

      <p id="setupMessage" class="auth-message mt-3 text-center fs-7 fw-semibold mb-0" aria-live="polite"></p>

      <div class="text-center pt-4 mt-3 border-top border-secondary border-opacity-25">
        <a href="../login/index.html" class="text-white-50 text-decoration-none fs-7 hover-orange"><i class="bi bi-arrow-left me-1"></i> Go to Admin Sign In</a>
      </div>
    </section>
  </main>

  <script src="setup.js"></script>
</body>
</html>
