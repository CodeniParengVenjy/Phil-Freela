<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhilFreela Access – Sign In & Register</title>
  <link rel="icon" type="image/svg+xml" href="../../images/logo-philfreela.svg" />
  
  <!-- Fonts & Bootstrap 5 & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="login.css?v=20260830" />
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <main class="auth-wrapper position-relative w-100 px-3 max-w-500">
    
    <!-- Background Animated Mesh Glows -->
    <div class="auth-bg-glow glow-orange"></div>
    <div class="auth-bg-glow glow-cyan"></div>

    <!-- Main Auth Glass Card -->
    <section class="auth-card glass-card p-4 p-sm-5 rounded-5 border border-secondary border-opacity-25 shadow-2xl position-relative z-2" id="authCard">
      
      <!-- Brand Logo Header -->
      <div class="text-center mb-4">
        <a href="../homepage/index.html" class="d-inline-block mb-3">
          <img src="../../images/logo-philfreela.svg" alt="PhilFreela" style="height: 46px;" class="logo-glow" />
        </a>
        <p class="text-warning fw-extrabold tracking-widest fs-8 text-uppercase mb-1">PHILFREELA ACCESS PORTAL</p>
        <h1 class="fw-black text-white h3 mb-1" id="authHeading">Work Without Limits</h1>
        <p class="text-secondary fs-7 mb-0">Sign in to your account or create one in seconds.</p>
      </div>

      <!-- Mode Switcher Tabs -->
      <div class="mode-switch-grid p-1 rounded-pill bg-black bg-opacity-50 border border-secondary border-opacity-25 mb-4 d-flex" role="tablist">
        <button type="button" class="mode-btn btn flex-grow-1 rounded-pill text-white fw-bold py-2 fs-7 is-active" data-mode="signin" role="tab" aria-selected="true">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
        <button type="button" class="mode-btn btn flex-grow-1 rounded-pill text-white-50 fw-bold py-2 fs-7" data-mode="signup" role="tab" aria-selected="false">
          <i class="bi bi-person-plus me-1"></i> Create Account
        </button>
      </div>

      <!-- Auth Form -->
      <form id="authForm" class="d-flex flex-column gap-3" novalidate>
        
        <!-- Signup Field: Full Name -->
        <div class="field signup-only is-hidden">
          <label for="fullName" class="form-label text-white-50 fw-semibold fs-7 mb-1">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-white-50"><i class="bi bi-person"></i></span>
            <input id="fullName" name="fullName" type="text" class="form-control bg-secondary bg-opacity-25 border-secondary text-white placeholder-muted py-2" placeholder="e.g. Keanne Obias" maxlength="100" autocomplete="name" />
          </div>
        </div>

        <!-- Signup Field: Username -->
        <div class="field signup-only is-hidden">
          <label for="username" class="form-label text-white-50 fw-semibold fs-7 mb-1">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-white-50"><i class="bi bi-at"></i></span>
            <input id="username" name="username" type="text" class="form-control bg-secondary bg-opacity-25 border-secondary text-white placeholder-muted py-2" placeholder="keanne_dev" autocomplete="username" />
          </div>
        </div>

        <!-- Shared Field: Email -->
        <div class="field">
          <label for="email" class="form-label text-white-50 fw-semibold fs-7 mb-1">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-white-50"><i class="bi bi-envelope"></i></span>
            <input id="email" name="email" type="email" class="form-control bg-secondary bg-opacity-25 border-secondary text-white placeholder-muted py-2" autocomplete="email" inputmode="email" placeholder="name@example.com" required />
          </div>
        </div>

        <!-- Shared Field: Password -->
        <div class="field">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label text-white-50 fw-semibold fs-7 mb-0">Password</label>
            <a id="forgotPasswordLink" class="text-orange fs-8 text-decoration-none hover-orange fw-semibold" href="forgot-password.html">Forgot password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-white-50"><i class="bi bi-lock"></i></span>
            <input id="password" name="password" type="password" class="form-control bg-secondary bg-opacity-25 border-secondary text-white py-2" autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" class="btn btn-outline-secondary border-secondary text-white-50 password-toggle" data-target="password" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>

        <!-- Signup Field: Confirm Password -->
        <div class="field signup-only is-hidden">
          <label for="confirmPassword" class="form-label text-white-50 fw-semibold fs-7 mb-1">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-white-50"><i class="bi bi-shield-lock"></i></span>
            <input id="confirmPassword" name="confirmPassword" type="password" class="form-control bg-secondary bg-opacity-25 border-secondary text-white py-2" autocomplete="new-password" placeholder="••••••••" />
            <button type="button" class="btn btn-outline-secondary border-secondary text-white-50 password-toggle" data-target="confirmPassword" aria-label="Show confirm password"><i class="bi bi-eye"></i></button>
          </div>
        </div>

        <!-- Signup Field: Gender -->
        <div class="field signup-only is-hidden">
          <label for="gender" class="form-label text-white-50 fw-semibold fs-7 mb-1">Gender</label>
          <select id="gender" name="gender" class="form-select bg-secondary bg-opacity-25 border-secondary text-white py-2">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>

        <div class="d-flex align-items-center justify-content-between my-2">
          <div class="form-check">
            <input id="keepLogin" name="keepLogin" type="checkbox" class="form-check-input bg-dark border-secondary" />
            <label class="form-check-label text-white-50 fs-8" for="keepLogin">Remember me on this device</label>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-gradient-orange btn-lg w-100 rounded-3 fw-bold text-white shadow-glow py-2">
          Sign In
        </button>
      </form>

      <p id="authMessage" class="auth-message mt-3 text-center fs-7 fw-semibold mb-0" aria-live="polite"></p>

      <div class="text-center pt-4 mt-3 border-top border-secondary border-opacity-25">
        <a href="../homepage/index.html" class="text-white-50 text-decoration-none fs-7 hover-orange"><i class="bi bi-arrow-left me-1"></i> Back to Homepage</a>
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js?v=20260830"></script>
</body>
</html>
