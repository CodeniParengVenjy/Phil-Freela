<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - PhilFreela</title>
  <link rel="icon" type="image/svg+xml" href="../../images/logo-philfreela.svg" />
  
  <!-- Fonts & Bootstrap 5 & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="login.css?v=20260830" />
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <main class="auth-wrapper position-relative w-100 px-3 max-w-500">
    <div class="auth-bg-glow glow-orange"></div>

    <section class="auth-card glass-card p-4 p-sm-5 rounded-5 border border-secondary border-opacity-25 shadow-2xl position-relative z-2">
      
      <div class="text-center mb-4">
        <a href="../homepage/index.html" class="d-inline-block mb-3">
          <img src="../../images/logo-philfreela.svg" alt="PhilFreela" style="height: 46px;" class="logo-glow" />
        </a>
        <p class="text-warning fw-extrabold tracking-widest fs-8 text-uppercase mb-1">PHILFREELA ACCESS PORTAL</p>
        <h1 class="fw-black text-white h3 mb-1">Reset Your Password</h1>
        <p class="text-secondary fs-7 mb-0">Enter your registered account email and set a new password.</p>
      </div>

      <form id="forgotForm" class="d-flex flex-column gap-3" novalidate>
        <div class="field">
          <label for="forgotEmail" class="form-label text-white-50 fw-semibold fs-7 mb-1">Account Email</label>
          <div class="input-group">
            <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-white-50"><i class="bi bi-envelope"></i></span>
            <input id="forgotEmail" name="forgotEmail" type="email" class="form-control bg-secondary bg-opacity-25 border-secondary text-white placeholder-muted py-2" inputmode="email" placeholder="name@example.com" required />
          </div>
        </div>

        <div class="field">
          <label for="forgotPassword" class="form-label text-white-50 fw-semibold fs-7 mb-1">New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-white-50"><i class="bi bi-lock"></i></span>
            <input id="forgotPassword" name="forgotPassword" type="password" class="form-control bg-secondary bg-opacity-25 border-secondary text-white py-2" autocomplete="new-password" placeholder="••••••••" required />
            <button type="button" class="btn btn-outline-secondary border-secondary text-white-50 password-toggle" data-target="forgotPassword" aria-label="Show new password"><i class="bi bi-eye"></i></button>
          </div>
        </div>

        <div class="field">
          <label for="forgotConfirmPassword" class="form-label text-white-50 fw-semibold fs-7 mb-1">Confirm New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-white-50"><i class="bi bi-shield-lock"></i></span>
            <input id="forgotConfirmPassword" name="forgotConfirmPassword" type="password" class="form-control bg-secondary bg-opacity-25 border-secondary text-white py-2" autocomplete="new-password" placeholder="••••••••" required />
            <button type="button" class="btn btn-outline-secondary border-secondary text-white-50 password-toggle" data-target="forgotConfirmPassword" aria-label="Show confirm new password"><i class="bi bi-eye"></i></button>
          </div>
        </div>

        <div class="d-flex flex-column gap-2 pt-2">
          <button type="submit" id="forgotSubmitBtn" class="btn btn-gradient-orange btn-lg w-100 rounded-3 fw-bold text-white shadow-glow py-2">
            Update Password
          </button>
          <a class="btn btn-dark border border-secondary text-white rounded-3 py-2 fw-semibold text-center text-decoration-none fs-7" href="index.html">Cancel</a>
        </div>
      </form>

      <p id="authMessage" class="auth-message mt-3 text-center fs-7 fw-semibold mb-0" aria-live="polite"></p>

      <div class="text-center pt-4 mt-3 border-top border-secondary border-opacity-25">
        <a href="index.html" class="text-white-50 text-decoration-none fs-7 hover-orange"><i class="bi bi-arrow-left me-1"></i> Back to sign in</a>
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="forgot-password.js?v=20260830"></script>
</body>
</html>
