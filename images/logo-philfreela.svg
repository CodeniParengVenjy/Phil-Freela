<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Phil Freela Logo</title>
  <desc id="desc">Stylized script logo with Phil in orange and Freela in white</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffbf45"/>
      <stop offset="55%" stop-color="#ffa228"/>
      <stop offset="100%" stop-color="#f58600"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)" transform="skewX(-7)">
    <text x="95" y="190"
      font-family="Brush Script MT, Segoe Script, Lucida Handwriting, cursive"
      font-size="220"
      font-weight="700"
      fill="url(#gold)">Phil</text>

    <text x="78" y="395"
      font-family="Brush Script MT, Segoe Script, Lucida Handwriting, cursive"
      font-size="220"
      font-weight="700"
      fill="#f5f5f5">Freela</text>
  </g>
</svg>
